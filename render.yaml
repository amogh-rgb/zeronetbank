services:
  - type: web
    name: zeronetpay-bank
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zeronetpay-bank-db
          property: connectionString
      - key: SQLITE_DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: zeronetpay-bank-db
    databaseName: zeronetpay
    user: zeronetpay
